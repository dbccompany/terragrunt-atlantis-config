version: 2
updates:
  # Enable version updates for Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "dene14"
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # terragrunt's Go API is closed at v1.x; the library engine is pinned
      # to the last consumable minor line. CI verifies against the terragrunt
      # v1.1.4 CLI binary separately. When terragrunt re-opens its library
      # API, remove this ignore.
      - dependency-name: "github.com/gruntwork-io/terragrunt"
        update-types: ["version-update:semver-major"]
      # Transitive via terragrunt's git/CAS code, which terragrunt-atlantis-config
      # never executes (parse-only usage). go-git/v6 has no stable patched
      # release (only alphas that API-break terragrunt 0.99.5). Remove when the
      # embedded terragrunt library is retired for the v1.x CLI.
      - dependency-name: "github.com/go-git/go-git/v6"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "github.com/go-git/go-billy/v6"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    # Group updates to reduce PR noise
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
  
  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "dene14"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"
  
  # Enable version updates for Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    reviewers:
      - "dene14"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore"
      include: "scope"

