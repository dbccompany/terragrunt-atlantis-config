name: Build and test code
on: [push, pull_request]

jobs:
  run-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        golang-version: ["1.25.4"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup golang
        uses: actions/setup-go@v5
        with:
          go-version: "^${{ matrix.golang-version }}"
        id: go
      - name: Configure Go environment for Windows
        if: runner.os == 'Windows'
        run: |
          echo "GOTOOLCHAIN=auto" >> $GITHUB_ENV
          echo "GOPROXY=https://proxy.golang.org,direct" >> $GITHUB_ENV
        shell: bash
      - name: Clear Go module cache
        run: go clean -modcache || true
      - uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ matrix.os }}-${{ matrix.golang-version }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.golang-version }}-go-
      - name: Download dependencies
        run: go mod download
      - run: mkdir cmd/test_artifacts
      - run: go test -v -cover ./...
