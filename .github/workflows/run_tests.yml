name: Build and test code
on: 
  push:
  pull_request:
  workflow_dispatch:

jobs:
  run-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        golang-version: ["1.25"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup golang
        uses: actions/setup-go@v5
        with:
          go-version: "^${{ matrix.golang-version }}"
      - name: Cache Go modules
        uses: actions/cache@v4
        id: cache
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ matrix.os }}-${{ matrix.golang-version }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.golang-version }}-go-
      - name: Download dependencies
        run: go mod download
      - name: Create test artifacts directory
        run: mkdir -p cmd/test_artifacts
      - name: Run tests
        run: go test -v -cover ./...
