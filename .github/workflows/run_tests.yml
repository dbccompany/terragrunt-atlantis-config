name: Build and test code
on: 
  push:
  pull_request:
  workflow_dispatch:

jobs:
  run-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        golang-version: ["1.25"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup golang
        uses: actions/setup-go@v5
        with:
          go-version: "^${{ matrix.golang-version }}"
      - name: Verify Go version
        run: go version && go env GOROOT && go env GOPATH
      - name: Clear Go module cache
        run: go clean -modcache || true
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ matrix.os }}-${{ matrix.golang-version }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.golang-version }}-go-
      - name: Download dependencies
        run: go mod download
      - name: Create test artifacts directory
        run: mkdir -p cmd/test_artifacts
      - name: Run tests
        env:
          CGO_ENABLED: 0
          GOFLAGS: -mod=readonly
        run: |
          set +e
          go test -v -cover -timeout 10m -count=1 -parallel 4 ./... 2>&1 | tee test_output.log
          TEST_EXIT_CODE=${PIPESTATUS[0]}
          if [ $TEST_EXIT_CODE -ne 0 ]; then
            echo "::error::Tests exited with code $TEST_EXIT_CODE"
            if grep -q "panic:" test_output.log 2>/dev/null; then
              echo "::error::Panic detected in tests:"
              grep -A 20 "panic:" test_output.log || true
            fi
            if grep -q "fatal error:" test_output.log 2>/dev/null; then
              echo "::error::Fatal error detected in tests:"
              grep -A 20 "fatal error:" test_output.log || true
            fi
            echo "Full test output:"
            cat test_output.log
            exit $TEST_EXIT_CODE
          fi
        continue-on-error: false
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          path: test_output.log
          if-no-files-found: ignore
      - name: Cleanup test artifacts
        if: always()
        run: |
          case "${{ runner.os }}" in
            Windows)
              powershell -Command "if (Test-Path 'cmd\test_artifacts') { Remove-Item -Recurse -Force 'cmd\test_artifacts' }"
              ;;
            *)
              rm -rf cmd/test_artifacts || true
              ;;
          esac
        shell: bash
