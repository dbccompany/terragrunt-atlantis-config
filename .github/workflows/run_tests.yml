name: Build and test code
on: 
  push:
  pull_request:
  workflow_dispatch:

jobs:
  run-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        golang-version: ["1.25"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup golang
        uses: actions/setup-go@v5
        with:
          go-version: "^${{ matrix.golang-version }}"
      - name: Clear Go module cache
        run: go clean -modcache || true
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ matrix.os }}-${{ matrix.golang-version }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.golang-version }}-go-
      - name: Download dependencies
        run: go mod download
      - name: Create test artifacts directory
        run: mkdir -p cmd/test_artifacts
      - name: Run tests
        env:
          CGO_ENABLED: 0
          GOFLAGS: -mod=readonly
        run: go test -v -cover -timeout 10m -count=1 ./...
        continue-on-error: false
      - name: Cleanup test artifacts
        if: always()
        run: rm -rf cmd/test_artifacts || true
