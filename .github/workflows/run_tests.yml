name: Build and test code
on: [push, pull_request]

jobs:
  run-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        golang-version: ["1.25.4"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup golang
        uses: actions/setup-go@v5
        with:
          go-version: "^${{ matrix.golang-version }}"
      - name: Clear Go module cache
        run: go clean -modcache || true
      - uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ matrix.os }}-${{ matrix.golang-version }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.golang-version }}-go-
      - name: Download dependencies
        run: go mod download
      - name: Create test artifacts directory
        run: |
          case "${{ runner.os }}" in
            Windows)
              powershell -Command "if (-not (Test-Path 'cmd\test_artifacts')) { New-Item -ItemType Directory -Path 'cmd\test_artifacts' | Out-Null }"
              ;;
            *)
              mkdir -p cmd/test_artifacts
              ;;
          esac
        shell: bash
      - name: Run tests
        run: |
          go test -v -cover ./... 2>&1 | \
            sed '/Error: Error in function call/,/Cause: Traversed all the way to the root\./d' | \
            sed '/^[0-9][0-9]:[0-9][0-9]:[0-9][0-9]\.[0-9][0-9][0-9] ERROR/d' | \
            sed '/^[0-9][0-9]:[0-9][0-9]:[0-9][0-9]\.[0-9][0-9][0-9] ERROR.*Error: Error in function call/d' | \
            sed '/^[0-9][0-9]:[0-9][0-9]:[0-9][0-9]\.[0-9][0-9][0-9] ERROR.*on.*line.*in locals:/d' | \
            sed '/^[0-9][0-9]:[0-9][0-9]:[0-9][0-9]\.[0-9][0-9][0-9] ERROR.*Call to function/d' | \
            sed '/^[0-9][0-9]:[0-9][0-9]:[0-9][0-9]\.[0-9][0-9][0-9] ERROR.*Could not find/d' | \
            sed '/^[0-9][0-9]:[0-9][0-9]:[0-9][0-9]\.[0-9][0-9][0-9] ERROR.*Cause:/d' | \
            sed '/^[0-9][0-9]:[0-9][0-9]:[0-9][0-9]\.[0-9][0-9][0-9] ERROR.*environment_vars/d' | \
            sed '/^Error: extra_atlantis_dependencies contains non-string value at position/d'
