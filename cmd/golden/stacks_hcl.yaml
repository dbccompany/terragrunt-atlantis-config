automerge: false
parallel_apply: true
parallel_plan: true
projects:
- autoplan:
    enabled: false
    when_modified:
    - '*.hcl'
    - '*.tf*'
    - '**/*.hcl'
    - '**/*.tf*'
    - ../../units/vpc/**/*.hcl
    - ../../units/vpc/**/*.tf*
    - ../../units/app/**/*.hcl
    - ../../units/app/**/*.tf*
  dir: live/prod
- autoplan:
    enabled: false
    when_modified:
    - '*.hcl'
    - '*.tf*'
    - ../vpc/terragrunt.hcl
    - ../vpc/*.tf*
  dir: units/app
- autoplan:
    enabled: false
    when_modified:
    - '*.hcl'
    - '*.tf*'
  dir: units/vpc
version: 3
